# Sobe toda a plataforma:      docker compose up -d --build
# Só a infraestrutura (para rodar API/Worker/Angular localmente pela IDE):
#   docker compose up -d postgres mongo rabbitmq aspire-dashboard
name: devjourney

services:
  # ---------- Banco relacional ----------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devjourney
      POSTGRES_USER: devjourney
      POSTGRES_PASSWORD: devjourney
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devjourney"]
      interval: 5s
      retries: 10

  # ---------- Banco NoSQL (documentos) ----------
  mongo:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  # ---------- Message broker (UI de gerenciamento em http://localhost:15672 - guest/guest) ----------
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  # ---------- Observabilidade: traces, métricas e logs em http://localhost:18888 ----------
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true" # apenas para estudo local!
    ports:
      - "18888:18888" # UI
      - "4317:18889"  # receptor OTLP/gRPC

  # ---------- Aplicações ----------
  api:
    build:
      context: ./backend
      dockerfile: src/DevJourney.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Database=devjourney;Username=devjourney;Password=devjourney
      Mongo__ConnectionString: mongodb://mongo:27017
      RabbitMq__HostName: rabbitmq
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
    ports: ["5000:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  worker:
    build:
      context: ./backend
      dockerfile: src/DevJourney.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      Mongo__ConnectionString: mongodb://mongo:27017
      RabbitMq__HostName: rabbitmq
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
    depends_on:
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  web:
    build: ./frontend
    ports: ["4200:80"]
    depends_on: [api]

volumes:
  postgres-data:
  mongo-data:
