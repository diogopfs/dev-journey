<section class="card auth-card">
  <h1>Entrar</h1>
  <p class="muted">Use <code>admin&#64;devjourney.local</code> / <code>Admin&#64;123</code> para o primeiro acesso.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      E-mail
      <input type="email" formControlName="email" autocomplete="username" />
    </label>
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <small class="field-error">Informe um e-mail válido.</small>
    }

    <label>
      Senha
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    @if (error()) {
      <div class="alert">{{ error() }}</div>
    }

    <button type="submit" class="primary" [disabled]="loading()">
      {{ loading() ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>

  <p>Não tem conta? <a routerLink="/register">Cadastre-se</a></p>
</section>
