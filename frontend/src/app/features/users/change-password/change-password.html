<section class="card form-card">
  <h1>Alterar senha</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      Senha atual
      <input type="password" formControlName="currentPassword" autocomplete="current-password" />
    </label>

    <label>
      Nova senha
      <input type="password" formControlName="newPassword" autocomplete="new-password" />
    </label>
    @if (form.controls.newPassword.touched && form.controls.newPassword.invalid) {
      <small class="field-error">Mínimo de 8 caracteres, com maiúscula, minúscula, número e caractere especial.</small>
    }

    @if (error()) {
      <div class="alert">{{ error() }}</div>
    }
    @if (success()) {
      <div class="alert success">Senha alterada com sucesso!</div>
    }

    <button type="submit" class="primary" [disabled]="loading()">Alterar senha</button>
  </form>
</section>
